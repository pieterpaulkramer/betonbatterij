[project]
name = "betonbatterij"
version = "0.1.1"
description = "BetonBatterij — Slimme Vloerverwarming & Warmtepomp Regeling (Laag 1 Digital Twin)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: End-to-end smoke tests against a running Docker Home Assistant instance (~15s)",
    "e2e_full: Full E2E tests waiting for a real 5-minute UTC tick and Docker restart (up to ~5m)",
]
addopts = "-m 'not e2e and not e2e_full'"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
