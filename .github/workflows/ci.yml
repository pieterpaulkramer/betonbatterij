name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check against latest Home Assistant Core stable image.
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests & lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test & lint tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint (Ruff)
        run: python -m ruff check custom_components tests local_ha_test/scripts
      - name: Run offline unit tests
        run: python -m pytest -v

  hassfest:
    name: Home Assistant Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  e2e-docker-ha:
    name: Docker Home Assistant E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Prepare writable export directory for Linux bind mount
        run: |
          mkdir -p local_ha_test/share/betonbatterij_export
          chmod -R 0777 local_ha_test/share
      - name: Start Home Assistant Core in Docker
        run: docker compose -f local_ha_test/docker-compose.yml up -d homeassistant
      - name: Run Docker HA E2E smoke suite
        run: python -m pytest -m e2e -v
      - name: Dump Home Assistant logs on failure
        if: failure()
        run: docker compose -f local_ha_test/docker-compose.yml logs --tail=200 homeassistant
      - name: Stop Docker Home Assistant
        if: always()
        run: docker compose -f local_ha_test/docker-compose.yml down
